<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verify Your Account</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: #f4f4f4;
        margin: 0;
      }
      .container {
        background-color: #fff;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        text-align: center;
        max-width: 400px;
        width: 90%;
      }
      h1 {
        color: #333;
        margin-bottom: 20px;
      }
      p {
        color: #666;
        margin-bottom: 25px;
      }
      button {
        background-color: #007bff;
        color: white;
        padding: 12px 25px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
        transition: background-color 0.3s ease;
      }
      button:hover {
        background-color: #0056b3;
      }
      #responseMessage {
        margin-top: 20px;
        padding: 10px;
        border-radius: 5px;
        font-weight: bold;
      }
      .success {
        background-color: #e6ffe6;
        color: #28a745;
        border: 1px solid #28a745;
      }
      .error {
        background-color: #ffe6e6;
        color: #dc3545;
        border: 1px solid #dc3545;
      }
      .loading {
        color: #007bff;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Verify Your Account</h1>
      <p>
        Click the button below to verify your email address and activate your
        account.
      </p>
      <button id="verifyButton">Verify Account</button>
      <div id="responseMessage"></div>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const verifyButton = document.getElementById("verifyButton");
        const responseMessageDiv = document.getElementById("responseMessage");
        
        function getTokenFromUrl() {
          const pathParts = window.location.pathname.split("/");
          return pathParts[pathParts.length - 1];
        }

        const token = getTokenFromUrl();
        if (!token || token.length < 10) {
          responseMessageDiv.className = "error";
          responseMessageDiv.textContent =
            "Error: Verification token not found or invalid in URL.";
          verifyButton.disabled = true;
          return;
        }

        verifyButton.addEventListener("click", async () => {
          responseMessageDiv.textContent = "Verifying...";
          responseMessageDiv.className = "loading";
          verifyButton.disabled = true;

          try {
            // Adjust this URL to your actual API endpoint
            const apiUrl = `/api/users/verify/${token}`;

            const response = await fetch(apiUrl, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
            });

            const data = await response.json();

            if (response.ok && data.code === 200) {
              responseMessageDiv.textContent =
                data.message || "Verification successful!";
              responseMessageDiv.className = "success";
            } else {
              const errorMessage =
                data.message || "Verification failed. Please try again.";
              responseMessageDiv.textContent = `Error: ${errorMessage}`;
              responseMessageDiv.className = "error";
              verifyButton.disabled = false;
            }
          } catch (error) {
            console.error("Fetch error:", error);
            responseMessageDiv.textContent =
              "An unexpected error occurred. Please try again later.";
            responseMessageDiv.className = "error";
            verifyButton.disabled = false;
          }
        });
      });
    </script>
  </body>
</html>
